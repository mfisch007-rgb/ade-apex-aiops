[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ade-apex-aiops"
version = "0.1.0"
description = "ADE-APEX Enterprise AI Orchestration Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

authors = [
    { name = "ADE-APEX Engineering" }
]

keywords = [
    "ai",
    "automation",
    "llm",
    "agents",
    "workflow",
    "orchestration",
    "fastapi",
    "langgraph"
]

dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "sqlalchemy>=2.0.40",
    "alembic>=1.16.0",
    "psycopg[binary]>=3.2.0",
    "redis>=6.2.0",
    "httpx>=0.28.0",
    "structlog>=25.4.0",
    "loguru>=0.7.3",
    "langgraph>=0.6.0",
    "langchain>=0.3.0",
    "openai>=1.95.0",
    "tiktoken>=0.9.0",
    "python-dotenv>=1.1.0",
    "tenacity>=9.1.0",
    "orjson>=3.11.0",
    "prometheus-client>=0.22.0"
]

[project.optional-dependencies]

dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
    "black>=25.1.0",
    "mypy>=1.16.0",
    "pre-commit>=4.2.0"
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
